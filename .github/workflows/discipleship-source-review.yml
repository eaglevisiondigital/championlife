name: Discipleship isolated source review
on:
  pull_request:
    paths:
      - 'tools/discipleship-progression/**'
      - '.github/workflows/discipleship-source-review.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: node --test tools/discipleship-progression/*.test.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/discipleship-progression/worksheet-source.native.mjs
      - run: git diff --check
