name: Discipleship isolated source review
on:
  pull_request:
    paths:
      - 'tools/discipleship-progression/**'
      - 'assets/js/grip-worksheet.js'
      - 'getting-a-grip-5.html'
      - 'getting-a-grip-6.html'
      - 'getting-a-grip-7.html'
      - 'getting-a-grip-8.html'
      - 'getting-a-grip-9.html'
      - 'getting-a-grip-10.html'
      - 'getting-a-grip-11.html'
      - 'getting-a-grip-12.html'
      - 'getting-a-grip-13.html'
      - 'supabase/migrations/20261102210907_lessons_nine_thirteen_owned_worksheets.sql'
      - 'supabase/migrations/20261102200549_lessons_six_to_eight_owned_worksheets.sql'
      - 'supabase/migrations/20261102193245_lesson_five_owned_worksheet.sql'
      - 'supabase/migrations/20261101165620_prepare_owned_worksheet_transactions.sql'
      - 'supabase/migrations/20261101231330_owned_progression_snapshot.sql'
      - 'supabase/migrations/20261102014452_prepare_trusted_lesson_completion.sql'
      - '.github/workflows/discipleship-source-review.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: WORKSHEET_EXTENSIONS=1 node tools/discipleship-progression/completion.database.mjs
      - run: WORKSHEET_EXTENSIONS=1 TEST_NATIVE_PG=1 TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/discipleship-progression/completion.database.mjs
      - run: node tools/discipleship-progression/progression-snapshot.database.mjs
      - run: TEST_NATIVE_PG=1 TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/discipleship-progression/progression-snapshot.database.mjs
      - run: node --test tools/discipleship-progression/*.test.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/discipleship-progression/worksheet-source.native.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/discipleship-progression/worksheet-transactions.native.mjs
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/discipleship-progression/worksheet-transactions.browser.mjs
      - run: node tools/discipleship-progression/lesson-five.database.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" TEST_NATIVE_PG=1 node tools/discipleship-progression/lesson-five.database.mjs
      - run: node tools/discipleship-progression/lesson-five.browser.mjs
      - run: node tools/discipleship-progression/lessons-six-eight.database.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" TEST_NATIVE_PG=1 node tools/discipleship-progression/lessons-six-eight.database.mjs
      - run: WORKSHEET_LESSON=6 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: WORKSHEET_LESSON=7 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: WORKSHEET_LESSON=8 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: node tools/discipleship-progression/lessons-nine-thirteen.database.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" TEST_NATIVE_PG=1 node tools/discipleship-progression/lessons-nine-thirteen.database.mjs
      - run: WORKSHEET_LESSON=9 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: WORKSHEET_LESSON=10 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: WORKSHEET_LESSON=11 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: WORKSHEET_LESSON=12 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: WORKSHEET_LESSON=13 node tools/discipleship-progression/lesson-five.browser.mjs
      - run: git diff --check
