name: Events three-module forward contract
on:
  pull_request:
    paths:
      - 'tools/events-forward-contract/**'
      - '.github/workflows/events-forward-contract.yml'
permissions:
  contents: read
jobs:
  local-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: node tools/events-forward-contract/three-module.mjs
      - run: git diff --check
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order: ['forms,events,dream', 'forms,dream,events', 'events,forms,dream', 'events,dream,forms', 'dream,forms,events', 'dream,events,forms']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: forms_core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: node tools/events-forward-contract/three-module.mjs
        env:
          TEST_NATIVE_PG: '1'
          TEST_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:5432/forms_core_test
          COMPOSITION_ORDER: ${{ matrix.order }}
