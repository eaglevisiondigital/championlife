name: Church attendee restoration (synthetic only)
on:
  pull_request:
    paths:
      - 'assets/js/outreach-registration-staff.js'
      - 'supabase/migrations/20261103193001_church_operations_restore_capacity.sql'
      - 'tools/outreach/church-operations-restore.*.mjs'
      - '.github/workflows/church-operations-restore.yml'
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/outreach/church-operations-restore.native.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/outreach/church-operations-restore.installability.native.mjs
      - run: node tools/backend-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - run: node tools/outreach/church-operations-restore.browser.mjs
      - run: git diff --check
