name: Partner isolated source review
on:
  # Exact source-branch checks supplement current-base pull-request checks.
  # No workflow installs a hosted migration or activates application grants.
  push:
    branches:
      - 'codex/publish-partner-20261101'
    paths:
      - 'tools/partner-platform/**'
      - 'tools/outreach/shared-staff-backend*'
      - 'supabase/migrations/20261101154618_partner_assigned_metadata_boundary.sql'
      - 'supabase/migrations/20261101164328_partner_private_revocation_preparation.sql'
      - 'supabase/migrations/20261101214027_prepare_private_partner_assignment_issuance.sql'
      - '.github/workflows/partner-source-review.yml'
  pull_request:
    paths:
      - 'tools/partner-platform/**'
      - 'tools/outreach/shared-staff-backend*'
      - 'supabase/migrations/20261101154618_partner_assigned_metadata_boundary.sql'
      - 'supabase/migrations/20261101164328_partner_private_revocation_preparation.sql'
      - 'supabase/migrations/20261101214027_prepare_private_partner_assignment_issuance.sql'
      - '.github/workflows/partner-source-review.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: node --test tools/partner-platform/*.test.mjs tools/outreach/shared-staff-backend.test.mjs
      - run: node tools/partner-platform/authority-denials.pglite.mjs
      - run: npx --prefix tools/backend-tests playwright install --with-deps chromium webkit
      - run: node tools/partner-platform/staff-intake-review.browser.mjs
      - run: node tools/partner-platform/assigned-backend.browser.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/partner-platform/assigned-backend.native.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/partner-platform/authority-serialization.native.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/partner-platform/private-revocation.native.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/partner-platform/private-issuance.native.mjs
      - run: git diff --check
