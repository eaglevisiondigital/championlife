name: Course overview source review
on:
  pull_request:
    paths:
      - 'getting-a-grip.html'
      - 'tools/backend-tests/course-overview.browser.mjs'
      - '.github/workflows/course-overview.yml'
permissions:
  contents: read
jobs:
  overview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/backend-tests/course-overview.browser.mjs
      - run: node tools/site-build/build.mjs
      - run: git diff --check
