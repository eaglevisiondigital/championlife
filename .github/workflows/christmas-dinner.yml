name: Christmas Dinner registration checks
on:
  pull_request:
    paths: ['christmas-dinner-2026.html', 'events.html', 'netlify-forms.html', 'assets/js/christmas-dinner-2026.js', 'assets/css/christmas-dinner-2026.css', '.github/tests/**', '.github/workflows/christmas-dinner.yml']
  push:
    branches: ['codex/christmas-dinner-2026']
permissions:
  contents: read
jobs:
  christmas-registration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix .github/tests
      - run: npm test --prefix .github/tests
