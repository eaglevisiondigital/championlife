      - name: Verify every source file and reproducible composed build
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: npm ci --ignore-scripts --prefix tools/backend-tests
      - name: Select exact disposable PostgreSQL 17
        shell: bash
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/postgres ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo mkdir -p /etc/postgresql-common/createcluster.d
            printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.d/partner-cycle13.conf > /dev/null
            sudo apt-get install --yes --no-install-recommends postgresql-17
          fi
          /usr/lib/postgresql/17/bin/postgres --version | grep -E '^postgres \(PostgreSQL\) 17\.'
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          echo "TEST_POSTGRES_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/outreach/campaign-summary.native.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/outreach/shared-staff-backend.native.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
