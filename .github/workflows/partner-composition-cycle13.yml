name: Partner and current Outreach exact-source acceptance
on:
  pull_request:
    paths:
      - 'tools/partner-integration-cycle13/**'
      - '.github/workflows/partner-composition-cycle13.yml'
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact immutable source commits without changing checkout
        run: git fetch --no-tags origin c170b0442b8015d9a8de9c7baa311754af95b484 4e29de51bbff57e4e3b3ccbdc750bd0edb960443
      - name: Materialize exact reviewed checkpoints and composition
        run: node tools/partner-integration-cycle13/compose.mjs "$RUNNER_TEMP/partner-cycle13"
      - name: Verify every source file and reproducible composed build
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - run: node --test tools/partner-integration-cycle13/composition.test.mjs tools/partner-integration-cycle13/composition.independent.test.mjs
      - name: Reverify exact sources after tests
        if: always()
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - run: git diff --check
  summary-node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact immutable source commits without changing checkout
        run: git fetch --no-tags origin c170b0442b8015d9a8de9c7baa311754af95b484 4e29de51bbff57e4e3b3ccbdc750bd0edb960443
      - name: Materialize exact reviewed checkpoints and composition
        run: node tools/partner-integration-cycle13/compose.mjs "$RUNNER_TEMP/partner-cycle13"
      - name: Verify every source file and reproducible composed build
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: npm ci --ignore-scripts --prefix tools/backend-tests
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node --test tools/outreach/shared-staff-backend.test.mjs tools/outreach/isolated-staff-summary-auth.test.mjs tools/outreach/campaign-summary.test.mjs tools/outreach/campaign-summary.review.test.mjs tools/outreach/campaign-summary-lifecycle.test.mjs tools/outreach/campaign-summary-lifecycle.review.test.mjs tools/outreach/church-outreach-summary-composition.test.mjs tools/outreach/church-outreach-auth-binding.test.mjs tools/outreach/church-outreach-summary-view.test.mjs tools/outreach/church-outreach-summary-entry.test.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/outreach
        run: node tools/outreach/people-followup-pagination-integrity.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/backend-tests/outreach-people.dom.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/backend-tests/outreach-registration.dom.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: git diff --check
      - name: Reverify exact sources after tests
        if: always()
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - run: git diff --check
  summary-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch exact immutable source commits without changing checkout
        run: git fetch --no-tags origin c170b0442b8015d9a8de9c7baa311754af95b484 4e29de51bbff57e4e3b3ccbdc750bd0edb960443
      - name: Materialize exact reviewed checkpoints and composition
        run: node tools/partner-integration-cycle13/compose.mjs "$RUNNER_TEMP/partner-cycle13"
      - name: Verify every source file and reproducible composed build
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: npm ci --ignore-scripts --prefix tools/backend-tests
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/backend-tests/node_modules/playwright/cli.js install --with-deps chromium webkit
      - name: Verify exact accepted SDK artifact
        shell: bash
        run: |
          curl --fail --silent --show-error --location 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0' --output "$RUNNER_TEMP/partner-cycle13-sdk.js"
          echo "bee24fc29228ed5a370f76a2ba1ca3c399549edad2fef23453c80148856a49af  $RUNNER_TEMP/partner-cycle13-sdk.js" | sha256sum --check
          echo "SUPABASE_SDK_PATH=$RUNNER_TEMP/partner-cycle13-sdk.js" >> "$GITHUB_ENV"
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/registration-print-roster.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/registration-checkin-status.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/registration-navigation.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/registration-search-composition.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/registration-search-composition-independent.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-followup-pagination.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-followup-pagination-independent.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-followup-composition.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-followup-composition-independent.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-followup-create.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-navigation.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/people-identity-race.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/walkup-retry.browser.mjs
      - working-directory: ${{ runner.temp }}/partner-cycle13/composition
        run: node tools/outreach/church-outreach-summary-staff.browser.mjs
      - name: Reverify exact sources after tests
        if: always()
        run: node tools/partner-integration-cycle13/verify.mjs "$RUNNER_TEMP/partner-cycle13"
      - run: git diff --check
  summary-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
