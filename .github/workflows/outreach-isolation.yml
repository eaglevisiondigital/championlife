name: Isolated Outreach candidate
on:
  pull_request:
    branches: [main, codex/outreach-campaign-core-v1, codex/outreach-phase-b-team-travel, codex/outreach-phase-c-registration-checkin, codex/outreach-phase-d-prizes, codex/outreach-phase-e-event-day, codex/outreach-phase-f-pre-event-automation, codex/staff-workspace-consolidation, codex/outreach-phase-g-communications-core]
  push:
    branches: [codex/outreach-partner-production-isolation, codex/outreach-campaign-core-v1, codex/outreach-phase-b-team-travel, codex/outreach-phase-c-registration-checkin, codex/outreach-phase-d-prizes, codex/outreach-phase-e-event-day, codex/outreach-phase-f-pre-event-automation, codex/staff-workspace-consolidation, codex/outreach-phase-g-communications-core, codex/communications-phase-h1-provider-activation]
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: npm test --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:campaign-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:team-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:registration-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:prize-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:event-day-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:pre-event-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:communications-concurrency --prefix tools/backend-tests
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" npm run test:provider-activation-concurrency --prefix tools/backend-tests
      - run: npx --yes deno@2.9.6 check supabase/functions/communications-provider-worker/index.ts supabase/functions/communications-provider-admin/index.ts supabase/functions/communications-provider-callback/index.ts
      - run: git diff --check
