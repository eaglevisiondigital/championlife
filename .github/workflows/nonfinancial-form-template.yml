name: Nonfinancial form template
on:
  pull_request:
    branches: [codex/giv-2c-reusable-forms-builder]
permissions:
  contents: read
jobs:
  forms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/backend-tests/forms-baptism.test.mjs
      - run: node tools/backend-tests/forms.test.mjs && node tools/backend-tests/forms-gateway.test.mjs && node tools/backend-tests/forms.dom.mjs
      - run: node tools/backend-tests/forms-baptism.browser.mjs
      - run: node tools/backend-tests/forms-private-journey.browser.mjs
      - run: node tools/site-build/build.mjs && node tools/backend-tests/site-build.test.mjs && git diff --check
