name: Forms and Events source composition
on:
  pull_request:
    paths:
      - 'assets/js/forms-admin.js'
      - 'tools/staff-composition/**'
      - '.github/workflows/staff-forms-events-composition.yml'
permissions:
  contents: read
jobs:
  sql-backed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/staff-composition/integrity.mjs
      - run: node tools/staff-composition/database.mjs
      - run: node tools/staff-composition/browser.mjs
      - run: node tools/forms-core/build-integrity.mjs
      - run: git diff --check
  native-order:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        order: ['forms,events', 'events,forms']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: forms_core_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: node tools/staff-composition/database.mjs
        env:
          TEST_NATIVE_PG: '1'
          TEST_DATABASE_URL: postgres://postgres:synthetic-only@127.0.0.1:5432/forms_core_test
          COMPOSITION_ORDER: ${{ matrix.order }}
