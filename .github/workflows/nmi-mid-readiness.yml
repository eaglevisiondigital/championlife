name: NMI four-MID readiness contract (nonproduction)
on:
  pull_request:
    paths:
      - 'docs/nmi-four-mid-readiness.template.json'
      - 'docs/NMI-FOUR-MID-ONBOARDING-2026-11-02.md'
      - 'tools/nmi/**'
      - 'assets/js/nmi-public-giving.js'
      - 'assets/js/nmi-giving-client.js'
      - '.github/workflows/nmi-mid-readiness.yml'
permissions:
  contents: read
jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Load exact reviewed PR107 executor and preserved PR78 webhook source
        run: |
          git fetch --no-tags --depth=1 origin b59e1afcbe2978d16e27883750ce20adb7d3a23d
          git fetch --no-tags --depth=1 origin e9e884c99899e5e4b14cc005fdd49f0d13e34d94
      - name: Test four-MID default-off and merchant-isolation contract
        run: node tools/nmi/mid-readiness.mjs --selftest
      - name: Test disabled checkout route planning
        run: node --test tools/nmi/boarding-handoff.test.mjs tools/nmi/disabled-routing.test.mjs tools/nmi/strict-approval.test.mjs tools/nmi/merchant-boundary.review.test.mjs tools/nmi/fictional-lookup-review.test.mjs tools/nmi/fictional-pilot-review.test.mjs tools/nmi/disabled-executor-probe.test.mjs tools/nmi/query-structure-pin.test.mjs tools/nmi/durable-pilot-review.test.mjs
      - name: Evaluate readiness without activating payments
        run: node tools/nmi/mid-readiness.mjs docs/nmi-four-mid-readiness.template.json
      - name: Ensure no conflicting diff formatting
        run: git diff --check

  native-durable-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only exact reviewed source compositions
        run: |
          git fetch --no-tags --depth=1 origin bfb7af214707db73a3a3164bc96ccafae7de8ccf
          git fetch --no-tags --depth=1 origin 84b2d9ab398bb8046570019da26a5db67fe77467
          git fetch --no-tags --depth=1 origin b59e1afcbe2978d16e27883750ce20adb7d3a23d
          git fetch --no-tags --depth=1 origin e9e884c99899e5e4b14cc005fdd49f0d13e34d94
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - name: Exercise real disposable PostgreSQL with fictional outcomes only
        run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/nmi/durable-pilot.native.mjs
      - name: Verify stored merchant proof matches the reviewed route without activation
        run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/nmi/durable-proof-mid.native.mjs
      - name: Independently verify merchant and settlement isolation
        run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/nmi/durable-proof-mid-independent.native.mjs
      - name: Exercise authoritative lookup and signed-webhook recovery with no provider network
        run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/nmi/durable-recovery.native.mjs

  public-session-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test actual unmounted giving client with intercepted fictional transport
        run: node tools/nmi/public-session.browser.mjs
      - name: Verify HTTP denial retires receipts before response-body parsing
        run: node tools/nmi/public-denial.browser.mjs
      - name: Independently check denial classification and unchanged uncertainty
        run: node tools/nmi/public-denial-independent.mjs
      - name: Preserve captured checkout frequency across delayed creation
        run: node tools/nmi/public-frequency.browser.mjs
      - name: Independently check checkout operation matches submitted intent
        run: node tools/nmi/public-frequency-independent.mjs
      - name: Verify imported source provenance and public exclusion
        run: |
          git fetch --no-tags --depth=1 origin 84b2d9ab398bb8046570019da26a5db67fe77467
          node --test tools/nmi/public-source.test.mjs
