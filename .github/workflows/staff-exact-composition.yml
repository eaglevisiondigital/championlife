name: Exact staff source composition
on:
  pull_request:
    paths:
      - 'tools/staff-exact-composition/**'
      - '.github/workflows/staff-exact-composition.yml'
permissions:
  contents: read
jobs:
  six-head-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/staff-exact-composition/integrity.mjs
      - run: node tools/staff-exact-composition/browser.mjs
      - run: git diff --check
