name: Public navigation source review
on:
  pull_request:
    paths:
      - 'assets/js/site.js'
      - 'tools/backend-tests/public-navigation.browser.mjs'
      - 'tools/backend-tests/public-menu.browser.mjs'
      - '.github/workflows/public-navigation.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/backend-tests/public-navigation.browser.mjs
      - run: node tools/backend-tests/public-menu.browser.mjs
      - run: git diff --check
