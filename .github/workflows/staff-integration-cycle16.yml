name: Bounded Partner and Communications staff integration
on:
  pull_request:
    paths:
      - 'staff-outreach-partners.html'
      - 'assets/js/staff-outreach-partners.js'
      - 'assets/js/staff-session.js'
      - 'assets/js/communications.js'
      - 'tools/partner-staff-cycle16/**'
      - 'tools/comms-host-cycle16/**'
      - 'tools/staff-integration-cycle16/**'
      - 'tools/staff-runtime-cycle14/**'
      - 'tools/staff-cycle9-integrity/integrity.mjs'
      - '.github/workflows/staff-integration-cycle16.yml'
permissions:
  contents: read
jobs:
  source-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/staff-integration-cycle16/source.test.mjs tools/partner-staff-cycle16/source.test.mjs tools/comms-host-cycle16/source.test.mjs
        env:
          ACTUAL_RUNTIME: '1'
      - run: node tools/staff-integration-cycle16/build.mjs
      - run: git diff --check
  integrated-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verify accepted SDK bytes
        run: |
          curl --fail --silent --show-error --location 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0' --output "$RUNNER_TEMP/supabase-sdk.js"
          echo "bee24fc29228ed5a370f76a2ba1ca3c399549edad2fef23453c80148856a49af  $RUNNER_TEMP/supabase-sdk.js" | sha256sum --check
          echo "SUPABASE_SDK_PATH=$RUNNER_TEMP/supabase-sdk.js" >> "$GITHUB_ENV"
      - run: node tools/partner-staff-cycle16/sdk-sri.browser.mjs
      - run: node tools/partner-staff-cycle16/await-controls.browser.mjs
      - run: node tools/partner-staff-cycle16/login-return.browser.mjs
      - run: node tools/partner-staff-cycle16/journey.browser.mjs
      - run: node tools/partner-staff-cycle16/independent.browser.mjs
      - run: node tools/comms-host-cycle16/remount.browser.mjs
        env:
          ACTUAL_RUNTIME: '1'
      - run: node tools/comms-host-cycle16/independent.browser.mjs
        env:
          ACTUAL_RUNTIME: '1'
      - run: git diff --check
