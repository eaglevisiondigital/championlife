name: Campaign decision consumer (synthetic PostgreSQL and browsers)
on:
  pull_request:
    paths:
      - 'tools/outreach/campaign-*'
      - 'tools/backend-tests/local-postgres.mjs'
      - 'tools/backend-tests/fixtures/supabase-test-bootstrap.sql'
      - 'tools/backend-tests/package*.json'
      - 'supabase/migrations/**'
      - 'supabase/bootstrap/**'
      - 'supabase/release/king-kind-reader-private-storage-candidate.sql'
      - '.github/workflows/campaign-consumer-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: node tools/outreach/campaign-assignment-contract.test.mjs
      - run: node tools/outreach/campaign-decision-adapter.test.mjs
      - name: Install disposable PostgreSQL 17
        shell: bash
        run: |
          if [ ! -x /usr/lib/postgresql/17/bin/postgres ]; then
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo mkdir -p /etc/postgresql-common/createcluster.d
            printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.d/campaign-consumer-ci.conf > /dev/null
            sudo apt-get install --yes --no-install-recommends postgresql-17
          fi
          campaign_pg_version="$(/usr/lib/postgresql/17/bin/postgres --version)"
          printf '%s\n' "$campaign_pg_version"
          case "$campaign_pg_version" in
            'postgres (PostgreSQL) 17.'*) ;;
            *) exit 1 ;;
          esac
      - name: Test exact reviewed SQL consumer boundaries
        run: TEST_POSTGRES_BIN=/usr/lib/postgresql/17/bin node tools/outreach/campaign-foundation-adapter.native.mjs
      - name: Install Chromium and WebKit
        run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Test unmounted consumer with fictional sessions and real local SQL
        run: TEST_POSTGRES_BIN=/usr/lib/postgresql/17/bin node tools/outreach/campaign-decision.browser.mjs
      - run: git diff --check
