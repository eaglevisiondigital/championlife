name: Staff legacy request initiation diagnostic
on:
  pull_request:
    paths:
      - 'tools/staff-cycle11/**'
      - '.github/workflows/staff-initiation-cycle11.yml'
permissions:
  contents: read
concurrency:
  group: staff-initiation-cycle11-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  bounded-initiation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/staff-cycle11/verify.mjs
      - run: node --test tools/staff-cycle11/initiation.test.mjs
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - name: Install exact locked WebKit and Linux dependencies
        timeout-minutes: 18
        run: tools/backend-tests/node_modules/.bin/playwright install --with-deps webkit
      - name: Verify accepted SDK bytes
        shell: bash
        run: |
          curl --fail --silent --show-error --location 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0' --output "$RUNNER_TEMP/supabase-sdk.js"
          echo "bee24fc29228ed5a370f76a2ba1ca3c399549edad2fef23453c80148856a49af  $RUNNER_TEMP/supabase-sdk.js" | sha256sum --check
          echo "SUPABASE_SDK_PATH=$RUNNER_TEMP/supabase-sdk.js" >> "$GITHUB_ENV"
          echo "HOST_SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_DIR=$RUNNER_TEMP/staff-initiation-cycle11" >> "$GITHUB_ENV"
      - name: Prove controlled fetch rejection remains visible
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p "$DIAGNOSTIC_DIR"
          node tools/staff-cycle11/negative-control.browser.mjs 2>&1 | tee "$DIAGNOSTIC_DIR/negative-control.log"
      - name: Observe one exact historical case with unchanged strict assertion
        timeout-minutes: 3
        shell: bash
        env:
          DIAGNOSTIC_OBSERVATIONS: '1'
        run: node tools/staff-cycle11/legacy.browser.mjs 2>&1 | tee "$DIAGNOSTIC_DIR/strict-result.log"
      - name: Preserve diagnostic evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staff-initiation-cycle11-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/staff-initiation-cycle11/
          if-no-files-found: warn
          retention-days: 7
      - if: always()
        run: git diff --check
