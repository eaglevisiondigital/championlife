name: Backend validation
on:
  pull_request:
  push:
    branches: [champion-sowgo-backend-v1]
permissions:
  contents: read
jobs:
  synthetic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: npm test --prefix tools/backend-tests
