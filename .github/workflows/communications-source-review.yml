name: Communications isolated source review
on:
  pull_request:
    paths:
      - 'tools/communications-policy/**'
      - 'supabase/functions/_shared/communications/providers.mjs'
      - 'supabase/functions/_shared/communications/activation.mjs'
      - '.github/workflows/communications-source-review.yml'
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/communications-policy/*.test.mjs
      - run: node tools/backend-tests/communications-provider.test.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/communications-policy/worker-durable.native.mjs
      - run: TEST_POSTGRES_BIN="$(pg_config --bindir)" node tools/communications-policy/external-worker.native.mjs
      - run: git diff --check
