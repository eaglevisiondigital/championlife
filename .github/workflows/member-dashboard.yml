name: Member dashboard source review
on:
  pull_request:
    paths:
      - 'my-discipleship.html'
      - 'tools/backend-tests/member-dashboard.browser.mjs'
      - '.github/workflows/member-dashboard.yml'
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --prefix tools/backend-tests
      - run: tools/backend-tests/node_modules/.bin/playwright install --with-deps chromium webkit
      - run: node tools/backend-tests/member-dashboard.browser.mjs
      - run: git diff --check
