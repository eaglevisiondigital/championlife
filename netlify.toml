[build]
  command = "node tools/site-build/build.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[edge_functions]]
  function = "dream-track-protect"
  path = "/dream-track*"

# Temporary reviewed Huntsville activation control; remove after use.
[[headers]]
  for = "/staff-huntsville-activation.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2; style-src 'self'; img-src 'self'; connect-src https://exdocjbmylgxssanymjk.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
[[headers]]
  for = "/staff-huntsville-activation"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'none'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2; style-src 'self'; img-src 'self'; connect-src https://exdocjbmylgxssanymjk.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
[[headers]]
  for = "/assets/js/staff-huntsville-activation.js"
  [headers.values]
    Cache-Control = "no-store"
