<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Outreach Partner Review</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .partner-workspace{max-width:900px;margin:32px auto;padding:20px;overflow-wrap:anywhere}
    .partner-workspace article{padding:24px;border:1px solid #bbb;border-radius:12px;margin:20px 0}
    .partner-workspace button,.partner-workspace select,.partner-workspace input{padding:12px;margin:6px;max-width:100%;font:inherit}
    .partner-workspace label{display:block}
    .partner-workspace-notice{padding:16px 18px;border:1px solid rgba(200,165,75,.48);border-radius:12px;background:rgba(200,165,75,.12);color:#f4e3ae;font-weight:700}
    .partner-workspace.is-denied{display:grid;place-items:center;max-width:none;min-height:100svh;margin:0;padding:clamp(24px,6vw,72px) 18px;background:radial-gradient(circle at 50% 8%,rgba(200,165,75,.15),transparent 36%),linear-gradient(145deg,#080808,#121315 62%,#080808)}
    .partner-workspace.is-denied .partner-workspace-intro{display:none}
    .partner-workspace.is-denied #outreach-intakes{width:min(100%,680px)}
    .partner-access-denied{position:relative;overflow:hidden;padding:clamp(30px,6vw,58px);border:1px solid rgba(200,165,75,.48);border-radius:var(--radius);background:linear-gradient(155deg,rgba(27,28,31,.98),rgba(14,15,17,.98));box-shadow:0 28px 80px rgba(0,0,0,.55);text-align:center}
    .partner-access-denied::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
    .partner-access-denied__brand{display:flex;justify-content:center;margin-bottom:26px}
    .partner-access-denied__brand img{width:min(230px,72%);height:auto;max-height:96px;object-fit:contain}
    .partner-access-denied__eyebrow{margin:0 0 12px;color:var(--gold2);font-size:.76rem;font-weight:900;letter-spacing:.2em;text-transform:uppercase}
    .partner-access-denied h2{max-width:540px;margin:0 auto 20px;color:#fff;font-size:clamp(2rem,6vw,3.35rem);line-height:1.04;letter-spacing:-.035em}
    .partner-access-denied__message{max-width:520px;margin:0 auto 12px;color:#f4f1e9;font-size:clamp(1.05rem,2.4vw,1.2rem);line-height:1.65}
    .partner-access-denied__help{max-width:500px;margin:0 auto;color:#b8bbc2;line-height:1.65}
    .partner-access-denied__cta{display:inline-flex;align-items:center;justify-content:center;min-height:54px;margin-top:28px;padding:14px 28px;border:1px solid var(--gold);border-radius:999px;background:var(--gold);color:#111;font-size:.84rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;transition:background .2s ease,transform .2s ease,box-shadow .2s ease}
    .partner-access-denied__cta:hover,.partner-access-denied__cta:focus-visible{background:var(--gold2);box-shadow:0 10px 28px rgba(200,165,75,.22);transform:translateY(-2px)}
    .partner-access-denied__cta:focus-visible{outline:3px solid #fff;outline-offset:4px}
    @media(max-width:520px){.partner-workspace.is-denied{padding:18px 14px}.partner-access-denied{padding:32px 22px;border-radius:18px}.partner-access-denied__brand{margin-bottom:22px}.partner-access-denied__cta{width:100%;padding-inline:18px}}
  </style>
</head>
<body>
  <main class="partner-workspace">
    <div class="partner-workspace-intro">
      <a href="staff-people.html">People workspace</a>
      <h1>Outreach Partner Review</h1>
      <p>Review outreach commitments and follow-up. Giving is managed separately.</p>
    </div>
    <div id="outreach-intakes"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/champion-life-auth.js"></script>
  <script src="assets/js/outreach-staff-common.js"></script>
  <script src="assets/js/staff-outreach-partners.js"></script>
</body>
</html>
