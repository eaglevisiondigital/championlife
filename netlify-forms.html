<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Form Definitions</title></head>
<body>
<form name="water-baptism-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="water-baptism-interest">
  <input name="bot-field">
  <input name="name">
  <input name="email" type="email">
  <input name="phone">
  <input name="wants-upcoming-information">
  <input name="saved">
  <input name="saved-when">
  <input name="previously-water-baptized">
  <textarea name="questions"></textarea>
</form>
<form name="dream-team-signup" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="dream-team-signup">
  <input name="bot-field">
  <input name="first-name">
  <input name="last-name">
  <input name="email" type="email">
  <input name="phone">
  <select name="serve-area"><option value=""></option></select>
  <textarea name="comments"></textarea>
  <input name="dream-track-understanding" type="checkbox" value="Yes">
</form>

<form name="outreach-partner" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
<input type="hidden" name="form-name" value="outreach-partner"><input name="bot-field"><input name="source-page"><input name="first-name"><input name="last-name"><input name="email" type="email"><input name="address-line-1"><input name="address-line-2"><input name="city"><input name="state-province"><input name="postal-code"><input name="phone"><input name="commitment-amount" type="number"><select name="commitment-frequency"><option>Weekly</option><option>Bi-weekly</option><option>Monthly</option></select></form>
</body></html>
